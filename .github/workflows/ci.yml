name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Placeholder values only. The build must not need real credentials --
      # env is validated lazily at runtime, and this proves that stays true.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          INBOUND_MAIL_WEBHOOK_SECRET: placeholder-secret-at-least-32-chars-long

      - name: Forge design layer typecheck
        run: npm run forge:build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      # Applies every migration to a clean database and runs the RLS
      # behavior matrix (supabase/tests/rls_matrix.sql): forged inbound
      # mail, self-verified domains, cross-user reads — all must stay
      # impossible.
      - name: Migrations apply + RLS matrix
        run: scripts/db-check.sh
